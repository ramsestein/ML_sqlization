[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnxsql"
version = "0.3.0"
description = "Modelos de machine learning -> reglas if-then -> una consulta SQL que se ejecuta en FakeNex (DataNex sintético), con validación automática"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.4", "joblib>=1.2"]

[project.urls]
Repository = "https://github.com/ramsestein/ML_sqlization"

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
fnxsql = "fnxsql.__main__:main"

[tool.setuptools]
packages = ["fnxsql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
